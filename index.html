<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editeur de pixels 64x64</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111827;
      --panel: #1f2937;
      --panel-border: #374151;
      --text: #f9fafb;
      --muted: #9ca3af;
      --pixel-off: #ffffff;
      --pixel-on: #111111;
      --grid: #d1d5db;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .app {
      width: min(100%, 860px);
      display: grid;
      gap: 16px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.25);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
    }

    .palette {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
    }

    .palette-label {
      color: var(--muted);
      font-size: 0.95rem;
    }

    button {
      border: 0;
      border-radius: 100px;
      padding: 10px 14px;
      font: inherit;
      font-weight: 600;
      color: var(--text);
      background: var(--accent);
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button:hover {
      background: var(--accent-hover);
    }

    .tool-button {
      background: #374151;
    }

    .tool-button:hover {
      background: #4b5563;
    }

    .tool-button.active {
      background: var(--accent);
    }

    .tool-button.active:hover {
      background: var(--accent-hover);
    }

    .color-button {
      width: 34px;
      height: 34px;
      padding: 0;
      border: 2px solid transparent;
      border-radius: 999px;
      background: transparent;
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.08);
    }

    .color-button:hover {
      background: transparent;
      transform: scale(1.04);
    }

    .color-button.active {
      border-color: #f9fafb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.45);
    }

    .color-swatch {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.22);
    }

    .status {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .canvas-wrap {
      overflow: auto;
      padding: 16px;
      background: #0b1220;
      border-radius: 16px;
      border: 1px solid var(--panel-border);
    }

    canvas {
      display: block;
      margin: 0 auto;
      background: var(--pixel-off);
      image-rendering: pixelated;
      cursor: crosshair;
      touch-action: none;
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="panel">
      <h1>Editeur de pixels 64x64</h1>
      <p>Choisissez une couleur pour dessiner, ou activez la gomme (bouton ou touche <strong>G</strong>) pour effacer en glissant.</p>

      <div class="toolbar">
        <button id="eraser-button" type="button" class="tool-button" title="Gomme (G)">Gomme</button>
        <button id="clear-button" type="button">Tout effacer</button>
        <button id="save-button" type="button">Enregistrer en BMP</button>
        <span class="status" id="status">0 pixels colores</span>
      </div>

      <div class="palette" id="palette" aria-label="Palette de couleurs">
        <span class="palette-label">Couleur active :</span>
      </div>
    </section>

    <section class="panel canvas-wrap">
      <canvas id="pixel-editor" width="640" height="640" aria-label="Grille de pixels 64x64"></canvas>
    </section>
  </main>

  <script>
    const gridSize = 64;
    const pixelSize = 10;
    const canvasSize = gridSize * pixelSize;

    const uiColors = {
      off: "#ffffff",
      grid: "#d1d5db",
    };

    const paletteColors = [
      { name: "Blanc", value: "#ffffff" },
      { name: "Gris", value: "#9ca3af" },
      { name: "Noir", value: "#111111" },
      { name: "Marron", value: "#92400e" },
      { name: "Brun", value: "#5c3d2e" },
      { name: "Beige", value: "#d4bc7a" },
      { name: "Rouge", value: "#ef4444" },
      { name: "Corail", value: "#fb7185" },
      { name: "Orange", value: "#f97316" },
      { name: "Jaune", value: "#eab308" },
      { name: "Vert", value: "#22c55e" },
      { name: "Menthe", value: "#6ee7b7" },
      { name: "Cyan", value: "#06b6d4" },
      { name: "Turquoise", value: "#14b8a6" },
      { name: "Bleu", value: "#3b82f6" },
      { name: "Indigo", value: "#6366f1" },
      { name: "Violet", value: "#a855f7" },
      { name: "Lavande", value: "#c4b5fd" },
      { name: "Prune", value: "#7e22ce" },
      { name: "Rose", value: "#ec4899" },
    ];

    const canvas = document.getElementById("pixel-editor");
    const ctx = canvas.getContext("2d");
    const eraserButton = document.getElementById("eraser-button");
    const clearButton = document.getElementById("clear-button");
    const saveButton = document.getElementById("save-button");
    const palette = document.getElementById("palette");
    const status = document.getElementById("status");

    const pixels = Array.from({ length: gridSize }, () => Array(gridSize).fill(null));
    let isPointerDown = false;
    let activePointerId = null;
    let toggledPixels = new Set();
    let activeTool = "paint";
    let selectedColor = paletteColors.find((color) => color.name === "Noir").value;

    function countColoredPixels() {
      let total = 0;
      for (const row of pixels) {
        for (const color of row) {
          if (color !== null) {
            total += 1;
          }
        }
      }
      return total;
    }

    function updateStatus() {
      const total = countColoredPixels();
      const countText = total <= 1 ? `${total} pixel colore` : `${total} pixels colores`;
      status.textContent = activeTool === "eraser" ? `Mode gomme · ${countText}` : countText;
    }

    function drawPixel(x, y) {
      ctx.fillStyle = pixels[y][x] ?? uiColors.off;
      ctx.fillRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);

      ctx.strokeStyle = uiColors.grid;
      ctx.lineWidth = 1;
      ctx.strokeRect(x * pixelSize + 0.5, y * pixelSize + 0.5, pixelSize, pixelSize);
    }

    function drawGrid() {
      ctx.clearRect(0, 0, canvasSize, canvasSize);
      for (let y = 0; y < gridSize; y += 1) {
        for (let x = 0; x < gridSize; x += 1) {
          drawPixel(x, y);
        }
      }
      updateStatus();
    }

    function getPixelCoordinates(event) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = Math.floor((event.clientX - rect.left) * scaleX / pixelSize);
      const y = Math.floor((event.clientY - rect.top) * scaleY / pixelSize);

      if (x < 0 || x >= gridSize || y < 0 || y >= gridSize) {
        return null;
      }

      return { x, y };
    }

    function getPixelKey(x, y) {
      return `${x},${y}`;
    }

    function setTool(tool) {
      activeTool = tool;
      eraserButton.classList.toggle("active", tool === "eraser");
      canvas.style.cursor = tool === "eraser" ? "cell" : "crosshair";

      for (const button of palette.querySelectorAll(".color-button")) {
        button.classList.toggle(
          "active",
          tool === "paint" && button.dataset.color === selectedColor,
        );
      }

      updateStatus();
    }

    function setSelectedColor(color) {
      selectedColor = color;
      setTool("paint");
    }

    function toggleEraser() {
      setTool(activeTool === "eraser" ? "paint" : "eraser");
    }

    function createPalette() {
      for (const color of paletteColors) {
        const button = document.createElement("button");
        const swatch = document.createElement("span");

        button.type = "button";
        button.className = "color-button";
        button.dataset.color = color.value;
        button.title = color.name;
        button.setAttribute("aria-label", `Choisir la couleur ${color.name}`);

        swatch.className = "color-swatch";
        swatch.style.background = color.value;

        button.appendChild(swatch);
        button.addEventListener("click", () => {
          setSelectedColor(color.value);
        });

        palette.appendChild(button);
      }

      setSelectedColor(selectedColor);
    }

    function applyPixelIfNeeded(x, y) {
      const key = getPixelKey(x, y);
      if (toggledPixels.has(key)) {
        return;
      }

      toggledPixels.add(key);

      if (activeTool === "eraser") {
        if (pixels[y][x] === null) {
          return;
        }
        pixels[y][x] = null;
      } else if (pixels[y][x] === selectedColor) {
        pixels[y][x] = null;
      } else {
        pixels[y][x] = selectedColor;
      }

      drawPixel(x, y);
      updateStatus();
    }

    function stopDrawing() {
      isPointerDown = false;
      activePointerId = null;
      toggledPixels = new Set();
    }

    function writeUint16LE(bytes, offset, value) {
      bytes[offset] = value & 0xff;
      bytes[offset + 1] = (value >> 8) & 0xff;
    }

    function writeUint32LE(bytes, offset, value) {
      bytes[offset] = value & 0xff;
      bytes[offset + 1] = (value >> 8) & 0xff;
      bytes[offset + 2] = (value >> 16) & 0xff;
      bytes[offset + 3] = (value >> 24) & 0xff;
    }

    function buildBmpBytes() {
      const bytesPerPixel = 3;
      const rowSize = Math.ceil((gridSize * bytesPerPixel) / 4) * 4;
      const pixelDataSize = rowSize * gridSize;
      const headerSize = 14 + 40;
      const fileSize = headerSize + pixelDataSize;
      const bytes = new Uint8Array(fileSize);

      bytes[0] = 0x42;
      bytes[1] = 0x4d;
      writeUint32LE(bytes, 2, fileSize);
      writeUint32LE(bytes, 10, headerSize);

      writeUint32LE(bytes, 14, 40);
      writeUint32LE(bytes, 18, gridSize);
      writeUint32LE(bytes, 22, gridSize);
      writeUint16LE(bytes, 26, 1);
      writeUint16LE(bytes, 28, 24);
      writeUint32LE(bytes, 34, pixelDataSize);
      writeUint32LE(bytes, 38, 2835);
      writeUint32LE(bytes, 42, 2835);

      let offset = headerSize;

      for (let y = gridSize - 1; y >= 0; y -= 1) {
        for (let x = 0; x < gridSize; x += 1) {
          const hexColor = pixels[y][x] ?? uiColors.off;
          const r = Number.parseInt(hexColor.slice(1, 3), 16);
          const g = Number.parseInt(hexColor.slice(3, 5), 16);
          const b = Number.parseInt(hexColor.slice(5, 7), 16);
          bytes[offset] = b;
          bytes[offset + 1] = g;
          bytes[offset + 2] = r;
          offset += bytesPerPixel;
        }

        while ((offset - headerSize) % rowSize !== 0) {
          bytes[offset] = 0x00;
          offset += 1;
        }
      }

      return bytes;
    }

    function downloadBmp() {
      const bytes = buildBmpBytes();
      const blob = new Blob([bytes], { type: "image/bmp" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = "pixel-art-64x64.bmp";
      document.body.appendChild(link);
      link.click();
      link.remove();

      URL.revokeObjectURL(url);
    }

    canvas.addEventListener("pointerdown", (event) => {
      if (event.button !== 0) {
        return;
      }

      const coords = getPixelCoordinates(event);
      if (!coords) {
        return;
      }

      isPointerDown = true;
      activePointerId = event.pointerId;
      toggledPixels = new Set();
      canvas.setPointerCapture(event.pointerId);
      applyPixelIfNeeded(coords.x, coords.y);
    });

    canvas.addEventListener("pointermove", (event) => {
      if (!isPointerDown || event.pointerId !== activePointerId) {
        return;
      }

      const coords = getPixelCoordinates(event);
      if (!coords) {
        return;
      }

      applyPixelIfNeeded(coords.x, coords.y);
    });

    canvas.addEventListener("pointerup", (event) => {
      if (event.pointerId !== activePointerId) {
        return;
      }

      if (canvas.hasPointerCapture(event.pointerId)) {
        canvas.releasePointerCapture(event.pointerId);
      }

      stopDrawing();
    });

    canvas.addEventListener("pointercancel", (event) => {
      if (event.pointerId !== activePointerId) {
        return;
      }

      stopDrawing();
    });

    canvas.addEventListener("lostpointercapture", () => {
      stopDrawing();
    });

    clearButton.addEventListener("click", () => {
      for (let y = 0; y < gridSize; y += 1) {
        for (let x = 0; x < gridSize; x += 1) {
          pixels[y][x] = null;
        }
      }
      drawGrid();
    });

    saveButton.addEventListener("click", () => {
      downloadBmp();
    });

    eraserButton.addEventListener("click", () => {
      toggleEraser();
    });

    window.addEventListener("keydown", (event) => {
      if (event.key !== "g" && event.key !== "G") {
        return;
      }

      if (
        event.target instanceof HTMLInputElement
        || event.target instanceof HTMLTextAreaElement
      ) {
        return;
      }

      event.preventDefault();
      toggleEraser();
    });

    createPalette();
    setTool("paint");
    drawGrid();
  </script>
</body>
</html>
