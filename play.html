<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personnage qui tourne sur la plage</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --panel: #111827;
      --panel-border: #334155;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --loop-duration: 1s;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, rgba(59, 130, 246, 0.18), transparent 28%), var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .card {
      width: min(100%, 680px);
      padding: 28px;
      border-radius: 20px;
      border: 1px solid var(--panel-border);
      background: rgba(17, 24, 39, 0.92);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 1.8rem;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .scene {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      margin: 28px auto 18px;
      width: min(100%, 560px);
      height: 260px;
      border-radius: 18px;
      background: linear-gradient(
        180deg,
        #38bdf8 0%,
        #7dd3fc 34%,
        #bae6fd 44%,
        #0ea5e9 44%,
        #0284c7 54%,
        #0369a1 61%,
        #c9a227 61%,
        #e9d5a8 74%,
        #d4bc7a 100%
      );
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .sun {
      position: absolute;
      top: 28px;
      left: 58px;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff7b8 0%, #fde047 42%, #f59e0b 100%);
      box-shadow: 0 0 32px rgba(253, 224, 71, 0.65);
      animation: sun-drift 16s ease-in-out infinite alternate;
    }

    .clouds,
    .ocean-far,
    .ocean-near,
    .sand {
      --drift-distance: 180px;
      position: absolute;
      inset-inline: -400px;
      background-repeat: repeat-x;
    }

    .clouds {
      --drift-distance: 180px;
      top: 18px;
      height: 90px;
      opacity: 0.7;
      background-image:
        radial-gradient(circle at 24px 28px, rgba(255, 255, 255, 0.95) 0 18px, transparent 19px),
        radial-gradient(circle at 46px 24px, rgba(255, 255, 255, 0.95) 0 16px, transparent 17px),
        radial-gradient(circle at 66px 30px, rgba(255, 255, 255, 0.95) 0 14px, transparent 15px);
      background-size: 180px 74px;
      animation: layer-drift 24s linear infinite;
    }

    .ocean-far {
      --drift-distance: 360px;
      bottom: 92px;
      height: 72px;
      opacity: 0.82;
      background-image:
        radial-gradient(ellipse 120px 36px at 50% 100%, rgba(14, 165, 233, 0.55) 0%, transparent 72%),
        radial-gradient(ellipse 100px 28px at 20% 88%, rgba(2, 132, 199, 0.45) 0%, transparent 68%),
        radial-gradient(ellipse 110px 32px at 78% 92%, rgba(3, 105, 161, 0.5) 0%, transparent 70%);
      background-size: 360px 72px;
      animation: layer-drift 14s linear infinite;
    }

    .ocean-near {
      --drift-distance: 400px;
      bottom: 58px;
      height: 88px;
      opacity: 0.92;
      background-image:
        radial-gradient(ellipse 140px 44px at 45% 100%, rgba(56, 189, 248, 0.35) 0%, transparent 75%),
        radial-gradient(ellipse 90px 22px at 12% 78%, rgba(255, 255, 255, 0.35) 0%, transparent 65%),
        radial-gradient(ellipse 95px 24px at 62% 82%, rgba(255, 255, 255, 0.28) 0%, transparent 62%),
        radial-gradient(ellipse 130px 40px at 88% 96%, rgba(14, 165, 233, 0.4) 0%, transparent 72%);
      background-size: 400px 88px;
      animation: layer-drift 7.5s linear infinite;
    }

    .sand {
      --drift-distance: 104px;
      bottom: 0;
      height: 88px;
      background:
        repeating-linear-gradient(
          90deg,
          #f4e4c1 0 28px,
          #e8d4aa 28px 56px,
          #dfc9a0 56px 104px
        );
      animation: layer-drift 5s linear infinite;
    }

    .beach-decor {
      position: absolute;
      inset-inline: 0;
      bottom: 10px;
      z-index: 1;
      height: 56px;
      overflow: hidden;
      pointer-events: none;
    }

    .beach-decor-track {
      display: flex;
      align-items: flex-end;
      gap: 18px;
      width: max-content;
      padding-inline: 12px;
      animation: beach-decor-drift 22s linear infinite;
    }

    .beach-decor img {
      display: block;
      width: auto;
      height: 40px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      flex-shrink: 0;
    }

    .beach-decor img.is-tall {
      height: 52px;
    }

    .shadow {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50%;
      background: rgba(120, 90, 50, 0.28);
      filter: blur(1px);
    }

    .orbit-pivot {
      position: absolute;
      left: 50%;
      bottom: 70px;
      width: 0;
      height: 0;
      z-index: 4;
      animation: orbit-spin 14s linear infinite;
    }

    @keyframes orbit-spin {
      from {
        transform: translateX(-50%) rotate(0deg);
      }

      to {
        transform: translateX(-50%) rotate(360deg);
      }
    }

    .orbit-offset {
      transform: translateX(106px);
    }

    .orbit-counter {
      animation: orbit-upright 14s linear infinite;
      transform-origin: center center;
    }

    @keyframes orbit-upright {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(-360deg);
      }
    }

    .orbit-sprite-box {
      position: relative;
      width: 88px;
      height: 104px;
      margin-left: -44px;
      margin-top: -98px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .orbit-sprite-box .orbit-shadow {
      bottom: 2px;
      animation: none;
      width: 54px;
      height: 12px;
    }

    .orbit-wrap img {
      width: auto;
      height: 94px;
      position: relative;
      z-index: 1;
      margin-bottom: 6px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      animation: none;
      transform: none;
    }

    .status {
      display: inline-block;
      margin-top: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(51, 65, 85, 0.65);
      color: var(--text);
      font-weight: 600;
      font-size: 0.95rem;
    }

    @keyframes sun-drift {
      from {
        transform: translateX(-18px) translateY(0);
      }
      to {
        transform: translateX(34px) translateY(8px);
      }
    }

    @keyframes layer-drift {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(calc(-1 * var(--drift-distance)));
      }
    }

    @keyframes beach-decor-drift {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

  </style>
</head>
<body>
  <main class="card">
    <h1>Plage pixel</h1>
    <p>Votre personnage tourne en cercle sur la plage : les cinq vues ont ete extraites de votre planche, les decors palmier et coquillages defilent dans le sable.</p>

    <div class="scene">
      <div class="sun" aria-hidden="true"></div>
      <div class="clouds" aria-hidden="true"></div>
      <div class="ocean-far" aria-hidden="true"></div>
      <div class="ocean-near" aria-hidden="true"></div>
      <div class="sand" aria-hidden="true"></div>

      <div class="beach-decor" aria-hidden="true">
        <div class="beach-decor-track" id="beach-decor-track"></div>
      </div>

      <div class="orbit-wrap orbit-pivot">
        <div class="orbit-offset">
          <div class="orbit-counter">
            <div class="orbit-sprite-box">
              <div class="orbit-shadow shadow" aria-hidden="true"></div>
              <img id="orbit-sprite" src="./assets/play/plage_tournant_0.png" alt="Personnage sur la plage">
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="status" id="status">Vue : face</div>
  </main>

  <script>
    const beachSprites = [
      { name: "palmier", tall: true },
      { name: "parasol", tall: true },
      { name: "coquillage" },
      { name: "rocher" },
      { name: "etoile_mer" },
      { name: "crabe" },
      { name: "chaise_plage", tall: true },
      { name: "palmier", tall: true },
      { name: "parasol", tall: true },
      { name: "coquillage" },
      { name: "rocher" },
      { name: "etoile_mer" },
    ];

    function buildBeachDecor() {
      const track = document.getElementById("beach-decor-track");
      const sequence = [...beachSprites, ...beachSprites];

      for (const item of sequence) {
        const image = document.createElement("img");
        image.src = `./assets/beach/${item.name}.png`;
        image.alt = "";
        image.decoding = "async";
        if (item.tall) {
          image.classList.add("is-tall");
        }
        track.appendChild(image);
      }
    }

    const orbitViews = [
      { src: "./assets/play/plage_tournant_0.png", label: "face" },
      { src: "./assets/play/plage_tournant_1.png", label: "trois-quarts avant" },
      { src: "./assets/play/plage_tournant_2.png", label: "profil" },
      { src: "./assets/play/plage_tournant_3.png", label: "dos" },
      { src: "./assets/play/plage_tournant_4.png", label: "trois-quarts arriere" },
    ];

    buildBeachDecor();

    const orbitSprite = document.getElementById("orbit-sprite");
    const status = document.getElementById("status");

    let orbitViewIndex = 0;

    function showOrbitView(index) {
      orbitViewIndex = index;
      const view = orbitViews[index];
      orbitSprite.src = view.src;
      status.textContent = `Vue : ${view.label}`;
    }

    showOrbitView(0);

    window.setInterval(() => {
      showOrbitView((orbitViewIndex + 1) % orbitViews.length);
    }, 220);
  </script>
</body>
</html>
